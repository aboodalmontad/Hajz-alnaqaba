<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress harmless Vite HMR WebSocket error in AI Studio iframe environment
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          const msg = args.map(a => String(a)).join(' ');
          if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('/@vite/client')) {
            return;
          }
          origError.apply(console, args);
        };
        window.addEventListener('error', function(event) {
          if (event && event.message && (event.message.includes('WebSocket') || event.message.includes('websocket'))) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason ? String(event.reason) : '';
          if (reason.includes('WebSocket') || reason.includes('websocket')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
